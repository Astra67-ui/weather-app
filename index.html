<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenki - Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="weather-app-img/images/rain.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main>
      <div class="card">
        <div class="search">
          <input
            type="text"
            placeholder="Search City"
            id="cityInput"
            spellcheck="false"
          />
          <button>
            <img src="weather-app-img/images/search.png" alt="Search" />
          </button>
        </div>
        <div class="error">
          <h2>Invalid City Name!</h2>
        </div>

        <div class="weather">
          <img
            src="weather-app-img/images/rain.png"
            alt="icon"
            class="weather-icon"
          />
          <h1 class="temp">22°C</h1>
          <h2 class="city">New York</h2>
          <div class="description">
            <div class="col">
              <img src="weather-app-img/images/humidity.png" />
              <div>
                <p class="humidity">50%</p>
                <p>Humidity</p>
              </div>
            </div>
            <div class="col">
              <img src="weather-app-img/images/wind.png" />
              <div>
                <p class="wind">10 km/h</p>
                <p>Wind Speed</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src=""config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
